# Deploys the somarec-api Edge Function to Supabase when it changes on main.
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   secret   SUPABASE_ACCESS_TOKEN  - from supabase.com/dashboard/account/tokens
#   variable SUPABASE_PROJECT_REF   - optional, defaults to ivtkcdnxewfnaazsrask
name: Deploy search function

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ivtkcdnxewfnaazsrask' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a Supabase access token as the SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Read-only public data, so the function doesn't require a signed-in user.
      - run: supabase functions deploy somarec-api --project-ref "$PROJECT_REF" --no-verify-jwt
