# Deploys backend/ to a Hugging Face Space (free CPU, Docker) whenever it changes on main.
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   secret   HF_TOKEN  - a Hugging Face access token with write access
#   variable HF_SPACE  - optional, defaults to nasengo/somarec-api
# The Space is created on the first run. The API is then served at
#   https://<owner>-<space-name>.hf.space   (e.g. https://nasengo-somarec-api.hf.space)
name: Deploy search API

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'nasengo/somarec-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is configured
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a Hugging Face write token as the HF_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare the Space folder
        run: |
          rsync -a --exclude '.cache' --exclude '__pycache__' --exclude 'tests' backend/ space/
          cat > space/README.md <<'MD'
          ---
          title: SomaRec API
          emoji: 📚
          colorFrom: red
          colorTo: yellow
          sdk: docker
          app_port: 7860
          pinned: false
          short_description: Thematic search over Kenyan literature
          ---

          Search and recommendation API for SomaRec. Deployed automatically from
          GitHub (backend/ folder); edit it there, not here. Health check: /api/health
          MD

      - name: Upload to the Space
        run: |
          pip install --quiet "huggingface_hub>=0.24"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              folder_path="space", repo_id=space, repo_type="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]} from GitHub",
              delete_patterns=["*"],
          )
          owner, name = space.split("/")
          print(f"Deployed. API: https://{owner}-{name}.hf.space/api/health".lower())
          PY
